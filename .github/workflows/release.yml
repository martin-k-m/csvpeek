name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The version lives in two places and they have disagreed before, so this
      # refuses to publish rather than shipping a wheel whose metadata does not
      # match what the package reports at runtime.
      - name: Versions agree with the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          DUNDER=$(grep -m1 '__version__' csvpeek/__init__.py | cut -d'"' -f2)
          echo "tag=$TAG pyproject=$PYPROJECT __version__=$DUNDER"
          test "$TAG" = "$PYPROJECT" || { echo "::error::pyproject.toml says $PYPROJECT, tag says $TAG"; exit 1; }
          test "$TAG" = "$DUNDER"   || { echo "::error::__version__ is $DUNDER, tag says $TAG"; exit 1; }

      - name: Test before publishing
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build

      # Installing the built wheel in a clean environment catches a package that
      # ships the wrong files, which a passing test suite run from the source
      # tree never will.
      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/csvpeek --version
          printf 'a,b\n1,2\n' > /tmp/t.csv
          /tmp/check/bin/csvpeek /tmp/t.csv --json | python -c "import json,sys; assert json.load(sys.stdin)['schema'] == 1"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --quiet twine
          python -m twine upload --non-interactive dist/*

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
