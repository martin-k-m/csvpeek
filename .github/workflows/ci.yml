name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters for a CSV tool: its \r\n line endings are exactly the
        # code path a Linux-only matrix never exercises. Kept to the floor and
        # current release there to hold the job count down.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest .
      - name: Run tests
        run: pytest -q
      - name: Smoke test CLI
        # Pinned to bash so the `> /dev/null` redirect works the same on the
        # Windows runners (Git Bash is preinstalled) as on Linux.
        shell: bash
        run: |
          csvpeek examples/people.csv --no-color
          csvpeek examples/people.csv --json > /dev/null
